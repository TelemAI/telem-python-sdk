[project]
name = "telem-sdk"
# Read from telem/_version.py (see [tool.hatch.version]) rather than written here,
# so a release bump is one edit in one file.
dynamic = ["version"]
description = "Python SDK for the Telem search orchestration API."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2",
]

[project.optional-dependencies]
langchain = ["langchain-core>=1", "langgraph>=1"]
openai = ["openai>=1"]

[project.scripts]
telem-install-skill = "telem.install_skill:main"

# Hermes Agent discovers plugins through this group, loads the module, and calls
# its `register` attribute — so the value is a bare MODULE, never `module:attr`.
# Nothing else is needed: Hermes synthesizes the plugin manifest from the entry
# point itself, and importing this module does not import Hermes.
[project.entry-points."hermes_agent.plugins"]
telem = "telem.integrations.hermes"

[dependency-groups]
dev = [
  "langchain>=1",
  "langgraph>=1",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "pre-commit>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "telem/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["telem"]


[tool.hatch.build.targets.sdist]
only-include = ["telem", "README.md", "LICENSE"]
# Note: hatchling unconditionally force-includes pyproject.toml, PKG-INFO,
# the README, and the repo's top-level .gitignore in every sdist target
# (SdistBuilder.get_default_build_data()); this is hardcoded and not
# affected by only-include/exclude/ignore-vcs. The stray .gitignore is a
# harmless, well-known hatchling default (no secrets, just cache/build
# ignore patterns) -- everything else (TS plugin sources, design notes,
# tests, etc.) is excluded by only-include above.

[tool.ruff]
line-length = 100
# Matches `requires-python` above, not `.python-version` (the dev pin). Keeping
# these in step is what stops py311+/py312+ syntax from reaching a 3.10 user:
# ruff's UP rules will not rewrite anything below this floor.
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "e2e: requires a live V2 backend",
]
